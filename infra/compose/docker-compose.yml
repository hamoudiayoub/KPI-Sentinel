# Local KPI Sentinel stack. Start it through the Makefile (`make up PROFILE=core`).
#
# Profiles group the services so that one part of the stack can run without the others:
#   core      source ERP, platform database, Kafka, Kafka Connect, event generator
#   lake      MinIO, Nessie, Trino, Spark, Dagster
#   platform  Keycloak, platform-api, agent-service, anomaly-detector, web
#   obs       OpenTelemetry Collector, Prometheus, Grafana, Tempo, Loki
#   all       every service
#
# Ports are bound to 127.0.0.1 only: nothing is exposed to the local network.
# Values come from .env next to this file (copy .env.example).

name: ${COMPOSE_PROJECT_NAME:-kpi-sentinel}

x-postgres-defaults: &postgres-defaults
  image: postgres:18.7-bookworm
  restart: unless-stopped
  networks: [sentinel]
  shm_size: 256mb
  deploy:
    resources:
      limits:
        memory: 512M

# Kafka in KRaft mode: each node is both broker and controller; the three controllers form
# a Raft quorum. Every topic is replicated three times and a write with acks=all needs two
# in-sync replicas, so one node can be lost without losing or refusing data.
x-kafka-defaults: &kafka-defaults
  image: apache/kafka:4.4.0
  restart: unless-stopped
  profiles: [core, all]
  networks: [sentinel]
  deploy:
    resources:
      limits:
        memory: 768M
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s

x-kafka-environment: &kafka-environment
  CLUSTER_ID: ipjmGZZySqCKtgtxtBWZ5Q
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_NUM_PARTITIONS: 3
  # Topics are declared explicitly (infra/kafka/topics.yaml, Kafka Connect), never by accident.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  # A replica that fell behind never becomes leader: no silent data loss.
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: -Xms384m -Xmx384m

services:
  # Simulated ERP. Logical decoding lets Debezium stream every change from the WAL.
  postgres-source:
    <<: *postgres-defaults
    profiles: [core, all]
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SOURCE_PASSWORD:?set POSTGRES_SOURCE_PASSWORD in infra/compose/.env}
      POSTGRES_DB: atlas
    ports:
      - "127.0.0.1:${POSTGRES_SOURCE_PORT:-5432}:5432"
    volumes:
      - postgres-source-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Applies the ERP schema migrations, then exits. Safe to re-run: applied versions are skipped.
  flyway-source:
    image: flyway/flyway:13.13.0-alpine
    profiles: [core, all]
    command: migrate
    networks: [sentinel]
    depends_on:
      postgres-source:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres-source:5432/atlas
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: ${POSTGRES_SOURCE_PASSWORD:?set POSTGRES_SOURCE_PASSWORD in infra/compose/.env}
      # Migration history lives in its own schema, outside the captured erp schema.
      FLYWAY_SCHEMAS: flyway,erp
      FLYWAY_DEFAULT_SCHEMA: flyway
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
      FLYWAY_PLACEHOLDERS_DEBEZIUM_PASSWORD: ${DEBEZIUM_DB_PASSWORD:?set DEBEZIUM_DB_PASSWORD in infra/compose/.env}
    volumes:
      - ../postgres/source/migrations:/flyway/migrations:ro
    deploy:
      resources:
        limits:
          memory: 256M

  # Containers talk to Kafka on INTERNAL (kafka-N:29092); the host uses EXTERNAL (localhost:<port>).
  kafka-1:
    <<: *kafka-defaults
    hostname: kafka-1
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:${KAFKA_1_PORT:-9092}
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:${KAFKA_1_PORT:-9092}
    ports:
      - "127.0.0.1:${KAFKA_1_PORT:-9092}:${KAFKA_1_PORT:-9092}"
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-defaults
    hostname: kafka-2
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:${KAFKA_2_PORT:-9094}
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:${KAFKA_2_PORT:-9094}
    ports:
      - "127.0.0.1:${KAFKA_2_PORT:-9094}:${KAFKA_2_PORT:-9094}"
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-defaults
    hostname: kafka-3
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:${KAFKA_3_PORT:-9096}
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:${KAFKA_3_PORT:-9096}
    ports:
      - "127.0.0.1:${KAFKA_3_PORT:-9096}:${KAFKA_3_PORT:-9096}"
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  # Creates or updates the application topics declared in infra/kafka/topics.yaml, then exits.
  kafka-init:
    build:
      context: ../kafka
      dockerfile: init/Dockerfile
    image: kpi-sentinel/kafka-init:local
    profiles: [core, all]
    networks: [sentinel]
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
    volumes:
      - ../kafka/topics.yaml:/etc/kafka-init/topics.yaml:ro
    deploy:
      resources:
        limits:
          memory: 256M

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.1
    restart: unless-stopped
    profiles: [core, all]
    networks: [sentinel]
    depends_on:
      kafka-1: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: atlas
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: -Xms128m -Xmx256m
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Simulated ERP activity. Run commands with `make seed`, or
  # `docker compose run --rm event-generator <command>`.
  event-generator:
    build:
      context: ../..
      dockerfile: services/event-generator/Dockerfile
    image: kpi-sentinel/event-generator:local
    profiles: [generator]
    networks: [sentinel]
    depends_on:
      flyway-source: { condition: service_completed_successfully }
    environment:
      SENTINEL_GEN_DB_HOST: postgres-source
      SENTINEL_GEN_DB_PORT: 5432
      SENTINEL_GEN_DB_NAME: atlas
      SENTINEL_GEN_DB_USER: postgres
      SENTINEL_GEN_DB_PASSWORD: ${POSTGRES_SOURCE_PASSWORD:?set POSTGRES_SOURCE_PASSWORD in infra/compose/.env}
    deploy:
      resources:
        limits:
          memory: 1G

  # Databases of the platform services, one database and one owner role per service.
  postgres-platform:
    <<: *postgres-defaults
    profiles: [core, all]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PLATFORM_PASSWORD:?set POSTGRES_PLATFORM_PASSWORD in infra/compose/.env}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?set PLATFORM_DB_PASSWORD in infra/compose/.env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in infra/compose/.env}
      NESSIE_DB_PASSWORD: ${NESSIE_DB_PASSWORD:?set NESSIE_DB_PASSWORD in infra/compose/.env}
      DAGSTER_DB_PASSWORD: ${DAGSTER_DB_PASSWORD:?set DAGSTER_DB_PASSWORD in infra/compose/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PLATFORM_PORT:-5433}:5432"
    volumes:
      - postgres-platform-data:/var/lib/postgresql
      # Scripts in this folder run once, when the data volume is created.
      - ../postgres/platform/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  sentinel:
    name: sentinel

volumes:
  postgres-source-data:
  postgres-platform-data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
