# Root of the uv workspace (ADR-0001, ADR-0007).
# It is not an installable package: it carries the shared tooling (ruff, pytest)
# and declares where the monorepo's Python packages live. Each package has its own
# pyproject.toml, is added to `members` below when it is created, and is listed in the
# root dependencies so that `uv sync` installs it into the shared environment.

[project]
name = "kpi-sentinel"
version = "0.1.0"
description = "KPI Sentinel — Python workspace: generator, streaming, dbt, orchestration, detector, evaluation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["event-generator"]

[dependency-groups]
dev = [
  "ruff>=0.14",
  "pytest>=9",
  "pytest-cov>=7",
  "pyyaml>=6",
  "testcontainers[postgres]>=4.15",
]

[tool.uv]
package = false

[tool.uv.workspace]
# uv requires a pyproject.toml in every listed folder (globs included), so members are added
# explicitly as packages are created: services/event-generator, pipelines/streaming,
# pipelines/orchestration, pipelines/dbt, services/anomaly-detector, evaluation.
members = ["services/event-generator"]

[tool.uv.sources]
event-generator = { workspace = true }

# --- ruff: shared lint and format (docs/03-engineering-standards.md §7) ---
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["pipelines/dbt/target"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "N",        # pep8-naming
  "ANN",      # type annotations everywhere
  "S",        # bandit (security)
  "SIM",      # simplifications
  "RUF",      # ruff rules
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S106", "S603", "S607", "S608", "ANN"]   # asserts, test credentials, docker calls, fixture SQL, optional annotations
"**/conftest.py" = ["S106", "S603", "S607"]   # test helpers use test credentials and call docker

[tool.ruff.lint.isort]
known-first-party = ["sentinel_gen"]

# --- pytest: shared configuration ---
[tool.pytest.ini_options]
testpaths = ["services", "pipelines", "evaluation", "infra"]
# importlib mode: test files in different packages may share a name.
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
  "integration: tests that start a container (Testcontainers) or use the compose stack",
]
xfail_strict = true
