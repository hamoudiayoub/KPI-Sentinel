name: Bug
description: Incorrect behavior
title: "bug: "
labels: ["type:bug"]
body:
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: platform-api, spark silver, dbt…
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      render: bash
  - type: textarea
    id: logs
    attributes:
      label: Logs, trace ID
      render: text
